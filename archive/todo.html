<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>昴君的 Todo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #1a1a2e;
      --card: #16213e;
      --text: #e8e8e8;
      --text-dim: #888;
      --accent: #0f3460;
      --highlight: #e94560;
      --done: #4a5568;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    .container {
      width: 100%;
      max-width: 500px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 24px;
      text-align: center;
      color: var(--highlight);
    }

    .input-area {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid var(--accent);
      border-radius: 8px;
      background: var(--card);
      color: var(--text);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--highlight);
    }

    input[type="text"]::placeholder {
      color: var(--text-dim);
    }

    button.add-btn {
      padding: 12px 20px;
      background: var(--highlight);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
    }

    button.add-btn:hover {
      opacity: 0.9;
    }

    button.add-btn:active {
      transform: scale(0.95);
    }

    .todo-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .todo-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      background: var(--card);
      border-radius: 8px;
      transition: opacity 0.2s, transform 0.2s;
    }

    .todo-item.done {
      opacity: 0.5;
    }

    .todo-item.done .todo-text {
      text-decoration: line-through;
      color: var(--text-dim);
    }

    .todo-checkbox {
      width: 22px;
      height: 22px;
      border: 2px solid var(--accent);
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.2s, border-color 0.2s;
    }

    .todo-checkbox:hover {
      border-color: var(--highlight);
    }

    .todo-item.done .todo-checkbox {
      background: var(--highlight);
      border-color: var(--highlight);
    }

    .todo-checkbox::after {
      content: '✓';
      color: white;
      font-size: 12px;
      display: none;
    }

    .todo-item.done .todo-checkbox::after {
      display: block;
    }

    .todo-text {
      flex: 1;
      font-size: 1rem;
      word-break: break-word;
    }

    .delete-btn {
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 1.2rem;
      padding: 4px 8px;
      border-radius: 4px;
      transition: color 0.2s, background 0.2s;
    }

    .delete-btn:hover {
      color: var(--highlight);
      background: rgba(233, 69, 96, 0.1);
    }

    .stats {
      margin-top: 24px;
      text-align: center;
      color: var(--text-dim);
      font-size: 0.875rem;
    }

    .shortcuts {
      margin-top: 32px;
      padding: 16px;
      background: var(--card);
      border-radius: 8px;
      font-size: 0.8rem;
      color: var(--text-dim);
    }

    .shortcuts h3 {
      font-size: 0.875rem;
      color: var(--text);
      margin-bottom: 8px;
    }

    .shortcuts ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .shortcuts kbd {
      background: var(--accent);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
      margin-right: 8px;
    }

    .empty-state {
      text-align: center;
      color: var(--text-dim);
      padding: 40px 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>昴君的 Todo</h1>

    <div class="input-area">
      <input type="text" id="todoInput" placeholder="写点什么..." maxlength="200" autofocus>
      <button class="add-btn" id="addBtn">添加</button>
    </div>

    <div class="todo-list" id="todoList"></div>

    <div class="stats" id="stats"></div>

    <div class="shortcuts">
      <h3>键盘快捷键</h3>
      <ul>
        <li><kbd>Enter</kbd> 添加任务</li>
        <li><kbd>Space</kbd> 切换完成状态（选中时）</li>
        <li><kbd>Delete</kbd> 删除选中任务</li>
        <li><kbd>Esc</kbd> 取消选中</li>
        <li><kbd>↑</kbd><kbd>↓</kbd> 导航</li>
      </ul>
    </div>
  </div>

  <script>
    // ==================== State ====================
    let todos = [];
    let selectedIndex = -1;

    // ==================== DOM refs ====================
    const todoInput = document.getElementById('todoInput');
    const addBtn = document.getElementById('addBtn');
    const todoList = document.getElementById('todoList');
    const stats = document.getElementById('stats');

    // ==================== Storage ====================
    function loadTodos() {
      try {
        const stored = localStorage.getItem('rem-todos');
        todos = stored ? JSON.parse(stored) : [];
      } catch {
        todos = [];
      }
    }

    function saveTodos() {
      localStorage.setItem('rem-todos', JSON.stringify(todos));
    }

    // ==================== Render ====================
    function render() {
      if (todos.length === 0) {
        todoList.innerHTML = '<div class="empty-state">还没有任务哦～<br>写点什么开始吧！</div>';
        stats.textContent = '';
        return;
      }

      todoList.innerHTML = todos.map((todo, i) => `
        <div class="todo-item ${todo.done ? 'done' : ''} ${i === selectedIndex ? 'selected' : ''}"
             data-index="${i}"
             style="${i === selectedIndex ? 'box-shadow: 0 0 0 2px var(--highlight);' : ''}">
          <div class="todo-checkbox" onclick="toggleTodo(${i})"></div>
          <span class="todo-text" onclick="toggleTodo(${i})">${escapeHtml(todo.text)}</span>
          <button class="delete-btn" onclick="deleteTodo(${i})" title="删除">×</button>
        </div>
      `).join('');

      const doneCount = todos.filter(t => t.done).length;
      stats.textContent = `共 ${todos.length} 项 | 已完成 ${doneCount} | 剩余 ${todos.length - doneCount}`;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // ==================== Actions ====================
    function addTodo() {
      const text = todoInput.value.trim();
      if (!text) return;

      todos.unshift({ text, done: false });
      saveTodos();
      todoInput.value = '';
      render();
    }

    function toggleTodo(index) {
      todos[index].done = !todos[index].done;
      saveTodos();
      render();
    }

    function deleteTodo(index) {
      todos.splice(index, 1);
      if (selectedIndex >= todos.length) {
        selectedIndex = todos.length - 1;
      }
      saveTodos();
      render();
    }

    // ==================== Keyboard Navigation ====================
    document.addEventListener('keydown', (e) => {
      // Enter: add todo (when input focused)
      if (e.key === 'Enter' && document.activeElement === todoInput) {
        addTodo();
        return;
      }

      // Escape: deselect
      if (e.key === 'Escape') {
        selectedIndex = -1;
        render();
        return;
      }

      // Arrow navigation (when list has items)
      if (todos.length === 0) return;

      if (e.key === 'ArrowUp') {
        e.preventDefault();
        selectedIndex = Math.max(-1, selectedIndex - 1);
        render();
        return;
      }

      if (e.key === 'ArrowDown') {
        e.preventDefault();
        selectedIndex = Math.min(todos.length - 1, selectedIndex + 1);
        render();
        return;
      }

      // Space: toggle done (when selected)
      if (e.key === ' ' && selectedIndex >= 0) {
        e.preventDefault();
        toggleTodo(selectedIndex);
        return;
      }

      // Delete/Backspace: delete (when selected)
      if ((e.key === 'Delete' || e.key === 'Backspace') && selectedIndex >= 0) {
        e.preventDefault();
        deleteTodo(selectedIndex);
        return;
      }
    });

    // ==================== Init ====================
    addBtn.addEventListener('click', addTodo);
    loadTodos();
    render();
  </script>
</body>
</html>
