<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phase 0 — 需求讨论</title>
<style>
:root {
  --bg: #111110;
  --surface: #1a1a18;
  --line: #2A2A28;
  --accent: #C0392B;
  --text: #e0e0d8;
  --muted: #888880;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Noto Sans SC', -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
}
header {
  padding: 12px 20px;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--surface);
}
header h1 { font-size: 16px; font-weight: 400; }
header .dot { width: 8px; height: 8px; border-radius: 50%; background: #4CAF50; }
header .status { font-size: 12px; color: var(--muted); }
#messages {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.msg {
  max-width: 80%;
  padding: 12px 16px;
  border-radius: 12px;
  line-height: 1.6;
  font-size: 14px;
  white-space: pre-wrap;
}
.msg.user {
  align-self: flex-end;
  background: var(--accent);
  color: #fff;
}
.msg.agent {
  align-self: flex-start;
  background: var(--surface);
  border: 1px solid var(--line);
}
.msg.system {
  align-self: center;
  color: var(--muted);
  font-size: 12px;
  font-style: italic;
}
.msg .label {
  font-size: 11px;
  color: var(--muted);
  margin-bottom: 4px;
}
.msg.agent .label { color: var(--accent); }

#input-area {
  padding: 16px 20px;
  border-top: 1px solid var(--line);
  display: flex;
  gap: 10px;
  background: var(--surface);
}
#input-area input {
  flex: 1;
  background: var(--bg);
  border: 1px solid var(--line);
  color: var(--text);
  padding: 10px 16px;
  border-radius: 20px;
  font-size: 14px;
  outline: none;
}
#input-area input:focus { border-color: var(--accent); }
#input-area button {
  background: var(--accent);
  color: #fff;
  border: none;
  padding: 10px 20px;
  border-radius: 20px;
  cursor: pointer;
  font-size: 14px;
}
#input-area button:disabled { opacity: 0.5; cursor: not-allowed; }

.loading { display: flex; gap: 4px; padding: 4px 0; }
.loading span {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--muted);
  animation: bounce 1.4s infinite ease-in-out;
}
.loading span:nth-child(2) { animation-delay: 0.2s; }
.loading span:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounce {
  0%,80%,100% { transform: scale(0); }
  40% { transform: scale(1); }
}
</style>
</head>
<body>

<header>
  <div class="dot"></div>
  <h1>Phase 0 · 需求讨论</h1>
  <span class="status" id="status">就绪</span>
</header>

<div id="messages">
  <div class="msg system">👋 你好！我是需求讨论 Agent。告诉我你的创业想法，我会帮你梳理、质疑、深化。</div>
  <div class="msg system">我会做：市场调研 → 假设分析 → 多方案对比 → 范围建议 → 输出需求文档</div>
</div>

<div id="input-area">
  <input id="user-input" placeholder="输入你的想法..." autofocus>
  <button id="send-btn" onclick="sendMessage()">发送</button>
</div>

<script>
const messages = document.getElementById('messages');
const input = document.getElementById('user-input');
const btn = document.getElementById('send-btn');
const statusEl = document.getElementById('status');

function addMsg(text, role) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  if (role === 'agent') div.innerHTML = '<div class="label">🧠 需求讨论 Agent</div>' + text;
  else if (role === 'user') div.innerHTML = '<div class="label">你</div>' + text;
  else div.textContent = text;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

function showLoading() {
  const div = document.createElement('div');
  div.className = 'msg agent';
  div.id = 'loading-msg';
  div.innerHTML = '<div class="label">🧠 需求讨论 Agent</div><div class="loading"><span></span><span></span><span></span></div>';
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

function hideLoading() {
  const el = document.getElementById('loading-msg');
  if (el) el.remove();
}

async function sendMessage() {
  const text = input.value.trim();
  if (!text) return;

  addMsg(text, 'user');
  input.value = '';
  input.disabled = true;
  btn.disabled = true;
  statusEl.textContent = '思考中...';
  showLoading();

  try {
    const res = await fetch('/api/discuss', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text })
    });
    const data = await res.json();
    hideLoading();

    if (data.success) {
      addMsg(data.summary, 'agent');
      if (data.path) {
        addMsg('📄 需求文档已保存: ' + data.path + '\n\n审查后运行 npm run v3 开始构建', 'system');
      }
      statusEl.textContent = '完成';
    } else {
      addMsg('❌ 处理失败: ' + (data.error || '未知错误'), 'system');
      statusEl.textContent = '错误';
    }
  } catch (err) {
    hideLoading();
    addMsg('❌ 连接失败: 请确认 npm run discuss 已启动', 'system');
    statusEl.textContent = '离线';
  }

  input.disabled = false;
  btn.disabled = false;
  input.focus();
}

input.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });
</script>
</body>
</html>
