<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phase 0 — 需求讨论</title>
<style>
:root {
  --bg: #111110;
  --surface: #1a1a18;
  --line: #2A2A28;
  --accent: #C0392B;
  --green: #4CAF50;
  --text: #e0e0d8;
  --muted: #888880;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Noto Sans SC', -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
}
header {
  padding: 12px 20px;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--surface);
  flex-shrink: 0;
}
header h1 { font-size: 16px; font-weight: 400; }
header .dot { width: 8px; height: 8px; border-radius: 50%; }
header .dot.online { background: var(--green); }
header .dot.offline { background: var(--accent); }
header .status { font-size: 12px; color: var(--muted); margin-left: auto; }
header button {
  background: transparent;
  border: 1px solid var(--line);
  color: var(--muted);
  padding: 4px 12px;
  border-radius: 12px;
  cursor: pointer;
  font-size: 12px;
}
header button:hover { border-color: var(--accent); color: var(--text); }
#messages {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.msg {
  max-width: 85%;
  padding: 12px 16px;
  border-radius: 12px;
  line-height: 1.7;
  font-size: 14px;
  white-space: pre-wrap;
  word-break: break-word;
}
.msg.user {
  align-self: flex-end;
  background: var(--accent);
  color: #fff;
  border-bottom-right-radius: 4px;
}
.msg.agent {
  align-self: flex-start;
  background: var(--surface);
  border: 1px solid var(--line);
  border-bottom-left-radius: 4px;
}
.msg.agent .label { 
  font-size: 11px; 
  color: var(--accent); 
  margin-bottom: 6px;
  font-weight: 500;
}
.msg .doc-block {
  background: #0a0a08;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 12px;
  margin-top: 8px;
  font-family: monospace;
  font-size: 13px;
}
.msg .save-badge {
  display: inline-block;
  background: var(--green);
  color: #000;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 11px;
  margin-top: 8px;
}
.msg.system {
  align-self: center;
  color: var(--muted);
  font-size: 12px;
  text-align: center;
  max-width: 70%;
}
#input-area {
  padding: 16px 20px;
  border-top: 1px solid var(--line);
  display: flex;
  gap: 10px;
  background: var(--surface);
  flex-shrink: 0;
}
#input-area input {
  flex: 1;
  background: var(--bg);
  border: 1px solid var(--line);
  color: var(--text);
  padding: 10px 16px;
  border-radius: 20px;
  font-size: 14px;
  outline: none;
}
#input-area input:focus { border-color: var(--accent); }
#input-area input:disabled { opacity: 0.4; }
#input-area button {
  background: var(--accent);
  color: #fff;
  border: none;
  padding: 10px 20px;
  border-radius: 20px;
  cursor: pointer;
  font-size: 14px;
  white-space: nowrap;
}
#input-area button:disabled { opacity: 0.4; cursor: not-allowed; }
.loading { display: inline-flex; gap: 4px; padding: 4px 0; }
.loading span {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--muted);
  animation: bounce 1.4s infinite ease-in-out;
  display: inline-block;
}
.loading span:nth-child(2) { animation-delay: 0.2s; }
.loading span:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounce {
  0%,80%,100% { transform: scale(0); }
  40% { transform: scale(1); }
}
</style>
</head>
<body>

<header>
  <div class="dot online" id="dot"></div>
  <h1>Phase 0 · 需求讨论</h1>
  <span class="status" id="status">就绪</span>
  <button onclick="resetSession()" title="重新开始">↺ 新对话</button>
</header>

<div id="messages">
  <div class="msg system">👋 告诉我你的创业想法，我会通过提问帮你梳理清楚。</div>
</div>

<div id="input-area">
  <input id="user-input" placeholder="输入你的想法..." autofocus>
  <button id="send-btn" onclick="sendMessage()">发送</button>
</div>

<script>
const SESSION_ID = 'phase0-' + Date.now();
const messages = document.getElementById('messages');
const input = document.getElementById('user-input');
const btn = document.getElementById('send-btn');
const statusEl = document.getElementById('status');
const dot = document.getElementById('dot');

function addMsg(text, role) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  
  if (role === 'agent') {
    // 渲染文档块
    let html = '<div class="label">🧠 需求讨论 Agent</div>';
    const docMatch = text.match(/```REQUIREMENT\n([\s\S]*?)```/);
    if (docMatch) {
      const parts = text.split(/```REQUIREMENT[\s\S]*?```/);
      html += parts[0].replace(/\n/g, '<br>');
      html += '<div class="doc-block">' + docMatch[1].replace(/\n/g, '<br>') + '</div>';
      if (parts[1]) html += parts[1].replace(/\n/g, '<br>');
    } else {
      html += text.replace(/\n/g, '<br>');
    }
    if (text.includes('READY_TO_SAVE')) {
      html += '<div class="save-badge">✅ 已保存 REQUIREMENT.md</div>';
    }
    div.innerHTML = html;
  } else if (role === 'user') {
    div.textContent = text;
  } else {
    div.textContent = text;
  }
  
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

let loadingDiv = null;
function showLoading() {
  loadingDiv = document.createElement('div');
  loadingDiv.className = 'msg agent';
  loadingDiv.innerHTML = '<div class="label">🧠 需求讨论 Agent</div><div class="loading"><span></span><span></span><span></span></div>';
  messages.appendChild(loadingDiv);
  messages.scrollTop = messages.scrollHeight;
}
function hideLoading() {
  if (loadingDiv) { loadingDiv.remove(); loadingDiv = null; }
}

async function sendMessage() {
  const text = input.value.trim();
  if (!text) return;

  addMsg(text, 'user');
  input.value = '';
  input.disabled = true;
  btn.disabled = true;
  statusEl.textContent = '思考中...';
  showLoading();

  try {
    const res = await fetch('/api/discuss', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, sessionId: SESSION_ID })
    });
    const data = await res.json();
    hideLoading();

    if (data.success) {
      addMsg(data.reply, 'agent');
      if (data.readyToSave) {
        statusEl.textContent = '需求文档已保存';
        addMsg('📄 需求文档已保存到 .tasks/REQUIREMENT.md\n\n运行 npm run v3 开始构建', 'system');
        btn.textContent = '✅ 完成';
        btn.style.background = 'var(--green)';
        btn.onclick = () => { addMsg('运行: npm run v3', 'system'); };
      } else {
        statusEl.textContent = '等待你的回复...';
      }
    } else {
      addMsg('❌ ' + (data.error || '处理失败'), 'system');
      statusEl.textContent = '错误';
    }
  } catch (err) {
    hideLoading();
    addMsg('❌ 连接失败: 请确认 npm run discuss 已启动', 'system');
    statusEl.textContent = '离线';
    dot.className = 'dot offline';
  }

  input.disabled = false;
  btn.disabled = (statusEl.textContent === '需求文档已保存');
  input.focus();
}

async function resetSession() {
  try {
    await fetch('/api/reset', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sessionId: SESSION_ID })
    });
  } catch(e) {}
  messages.innerHTML = '<div class="msg system">👋 新对话开始。告诉我你的创业想法。</div>';
  statusEl.textContent = '就绪';
  input.disabled = false;
  btn.disabled = false;
  btn.textContent = '发送';
  btn.style.background = 'var(--accent)';
  btn.onclick = sendMessage;
  input.focus();
}

input.addEventListener('keydown', e => { 
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
</script>
</body>
</html>
