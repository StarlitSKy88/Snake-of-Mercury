<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phase 0 — 需求讨论</title>
<style>
:root {
  --bg: #111110;
  --surface: #1a1a18;
  --line: #2A2A28;
  --accent: #C0392B;
  --green: #4CAF50;
  --text: #e0e0d8;
  --muted: #888880;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Noto Sans SC', -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
}
/* 侧边栏 */
#sidebar {
  width: 260px;
  background: var(--surface);
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
}
#sidebar-header {
  padding: 16px;
  border-bottom: 1px solid var(--line);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
#sidebar-header h2 { font-size: 14px; font-weight: 400; }
#new-btn {
  background: var(--accent);
  color: #fff;
  border: none;
  padding: 6px 14px;
  border-radius: 14px;
  cursor: pointer;
  font-size: 13px;
}
#session-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
}
.session-item {
  padding: 10px 12px;
  border-radius: 8px;
  cursor: pointer;
  margin-bottom: 4px;
  border: 1px solid transparent;
  transition: all 0.15s;
}
.session-item:hover { background: rgba(255,255,255,0.04); }
.session-item.active { background: rgba(192,57,43,0.12); border-color: var(--accent); }
.session-item .title {
  font-size: 13px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.session-item .meta {
  font-size: 11px;
  color: var(--muted);
  margin-top: 2px;
}
.session-item .badge {
  display: inline-block;
  background: var(--green);
  color: #000;
  padding: 0 6px;
  border-radius: 8px;
  font-size: 10px;
  margin-left: 4px;
}
/* 主区域 */
#main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
}
header {
  padding: 12px 20px;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--surface);
  flex-shrink: 0;
}
header h1 { font-size: 15px; font-weight: 400; }
header .dot { width: 8px; height: 8px; border-radius: 50%; }
header .dot.online { background: var(--green); }
header .dot.offline { background: var(--accent); }
header .status { font-size: 12px; color: var(--muted); margin-left: auto; }
#messages {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.msg {
  max-width: 80%;
  padding: 12px 16px;
  border-radius: 12px;
  line-height: 1.7;
  font-size: 14px;
  white-space: pre-wrap;
  word-break: break-word;
}
.msg.user {
  align-self: flex-end;
  background: var(--accent);
  color: #fff;
  border-bottom-right-radius: 4px;
}
.msg.agent {
  align-self: flex-start;
  background: var(--surface);
  border: 1px solid var(--line);
  border-bottom-left-radius: 4px;
}
.msg.agent .label { font-size: 11px; color: var(--accent); margin-bottom: 6px; font-weight: 500; }
.msg .doc-block {
  background: #0a0a08;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 12px;
  margin-top: 8px;
  font-family: 'SF Mono', 'Fira Code', monospace;
  font-size: 13px;
}
.msg .save-badge {
  display: inline-block;
  background: var(--green);
  color: #000;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 11px;
  margin-top: 8px;
}
.msg.system {
  align-self: center;
  color: var(--muted);
  font-size: 12px;
  text-align: center;
  max-width: 70%;
}
#input-area {
  padding: 14px 20px;
  border-top: 1px solid var(--line);
  display: flex;
  gap: 10px;
  background: var(--surface);
  flex-shrink: 0;
}
#input-area input {
  flex: 1;
  background: var(--bg);
  border: 1px solid var(--line);
  color: var(--text);
  padding: 10px 16px;
  border-radius: 20px;
  font-size: 14px;
  outline: none;
}
#input-area input:focus { border-color: var(--accent); }
#input-area input:disabled { opacity: 0.4; }
#input-area button {
  background: var(--accent);
  color: #fff;
  border: none;
  padding: 10px 20px;
  border-radius: 20px;
  cursor: pointer;
  font-size: 14px;
  white-space: nowrap;
}
#input-area button:disabled { opacity: 0.4; cursor: not-allowed; }
#stop-btn { background: #ff9800; display: none; }
#stop-btn.visible { display: inline-block; }
#edit-last-btn { background: transparent; color: var(--muted); border: 1px solid var(--line); padding: 4px 10px; font-size: 11px; border-radius: 12px; cursor: pointer; display: none; }
#edit-last-btn.visible { display: inline-block; }
.loading { display: inline-flex; gap: 4px; padding: 4px 0; }
.loading span {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--muted);
  animation: bounce 1.4s infinite ease-in-out;
  display: inline-block;
}
.loading span:nth-child(2) { animation-delay: 0.2s; }
.loading span:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounce { 0%,80%,100% { transform: scale(0); } 40% { transform: scale(1); } }
</style>
</head>
<body>

<!-- 侧边栏 -->
<div id="sidebar">
  <div id="sidebar-header">
    <h2>💬 历史对话</h2>
    <button id="new-btn" onclick="newSession()">+ 新对话</button>
  </div>
  <div id="session-list"></div>
</div>

<!-- 主区域 -->
<div id="main">
  <header>
    <div class="dot online" id="dot"></div>
    <h1>Phase 0 · 需求讨论</h1>
    <span class="status" id="status">就绪</span>
  </header>

  <div id="messages">
    <div class="msg system">👋 告诉我你的创业想法，我会通过提问帮你梳理清楚。</div>
  </div>

  <div id="input-area">
    <input id="user-input" placeholder="输入你的想法..." autofocus>
    <button id="edit-last-btn" onclick="editLastMessage()" title="编辑上一条消息 (↑)">✎</button>
    <button id="send-btn" onclick="sendMessage()">发送</button>
    <button id="stop-btn" onclick="stopSending()" title="中断当前回复">⏹ 停止</button>
  </div>
</div>

<script>
let currentSessionId = 'sess-' + Date.now();
let currentSaved = false;
let isComposing = false;  // IME 组合输入状态
let abortController = null;  // 用于中断请求
let lastUserMsg = null;  // 上一条用户消息 DOM 元素

const messages = document.getElementById('messages');
const input = document.getElementById('user-input');
const btn = document.getElementById('send-btn');
const statusEl = document.getElementById('status');
const dot = document.getElementById('dot');
const sessionList = document.getElementById('session-list');
const stopBtn = document.getElementById('stop-btn');
const editLastBtn = document.getElementById('edit-last-btn');

// ═══════ 会话管理 ═══════

async function loadSessions() {
  try {
    const res = await fetch('/api/sessions');
    const sessions = await res.json();
    renderSessionList(sessions);
  } catch(e) {}
}

function renderSessionList(sessions) {
  sessionList.innerHTML = sessions.map(s => `
    <div class="session-item ${s.id === currentSessionId ? 'active' : ''}" 
         onclick="switchSession('${s.id}')">
      <div class="title">${escHtml(s.title || '新对话')} ${s.saved ? '<span class="badge">已保存</span>' : ''}</div>
      <div class="meta">${s.turnCount} 轮 · ${timeAgo(s.updatedAt)}</div>
    </div>
  `).join('') || '<div style="color:var(--muted);padding:12px;font-size:12px;">暂无历史对话</div>';
}

async function switchSession(id) {
  if (id === currentSessionId) return;
  try {
    const res = await fetch('/api/sessions/load', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sessionId: id })
    });
    const data = await res.json();
    if (data.success) {
      currentSessionId = id;
      currentSaved = !!data.session.savedPath;
      renderTurns(data.session.turns);
      loadSessions();
      updateInputState();
      stopBtn.classList.remove('visible');
      abortController = null;
    }
  } catch(e) {}
}

function newSession() {
  currentSessionId = 'sess-' + Date.now();
  currentSaved = false;
  messages.innerHTML = '<div class="msg system">👋 新对话。告诉我你的创业想法。</div>';
  loadSessions();
  updateInputState();
  input.focus();
}

// ═══════ 消息渲染 ═══════

function renderTurns(turns) {
  messages.innerHTML = '';
  if (turns.length === 0) {
    messages.innerHTML = '<div class="msg system">👋 告诉我你的创业想法。</div>';
    return;
  }
  for (const t of turns) {
    addMsg(t.content, t.role);
  }
  messages.scrollTop = messages.scrollHeight;
}

function addMsg(text, role) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  
  if (role === 'agent') {
    let html = '<div class="label">🧠 需求讨论 Agent</div>';
    const docMatch = text.match(/```REQUIREMENT\n([\s\S]*?)```/);
    if (docMatch) {
      const parts = text.split(/```REQUIREMENT[\s\S]*?```/);
      html += parts[0].replace(/\n/g, '<br>');
      html += '<div class="doc-block">' + docMatch[1].replace(/\n/g, '<br>') + '</div>';
      if (parts[1]) html += parts[1].replace(/\n/g, '<br>');
    } else {
      html += text.replace(/\n/g, '<br>');
    }
    if (text.includes('READY_TO_SAVE')) {
      html += '<div class="save-badge">✅ 已保存 REQUIREMENT.md</div>';
    }
    div.innerHTML = html;
  } else if (role === 'user') {
    div.textContent = text;
  } else {
    div.textContent = text;
  }
  
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
  return div;
}

function updateInputState() {
  if (currentSaved) {
    input.disabled = true;
    btn.disabled = true;
    btn.textContent = '✅ 已完成';
    btn.style.background = 'var(--green)';
    statusEl.textContent = '需求已保存';
  } else {
    input.disabled = false;
    btn.disabled = false;
    btn.textContent = '发送';
    btn.style.background = 'var(--accent)';
    statusEl.textContent = '就绪';
  }
}

// ═══════ 发送消息 ═══════

let loadingDiv = null;
function showLoading() {
  loadingDiv = document.createElement('div');
  loadingDiv.className = 'msg agent';
  loadingDiv.innerHTML = '<div class="label">🧠 需求讨论 Agent</div><div class="loading"><span></span><span></span><span></span></div>';
  messages.appendChild(loadingDiv);
}
function hideLoading() { if (loadingDiv) { loadingDiv.remove(); loadingDiv = null; } }

async function sendMessage() {
  const text = input.value.trim();
  if (!text || currentSaved) return;

  const userMsg = addMsg(text, 'user');
  lastUserMsg = userMsg;
  editLastBtn.classList.add('visible');
  input.value = '';
  input.disabled = true;
  btn.disabled = true;
  stopBtn.classList.add('visible');
  statusEl.textContent = '思考中...';
  showLoading();

  // AbortController for interrupt
  abortController = new AbortController();

  try {
    const res = await fetch('/api/discuss', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, sessionId: currentSessionId }),
      signal: abortController.signal
    });
    const data = await res.json();
    hideLoading();

    if (data.success) {
      addMsg(data.reply, 'agent');
      if (data.readyToSave) {
        currentSaved = true;
        statusEl.textContent = '需求已保存';
        addMsg('📄 已保存到 .tasks/REQUIREMENT.md\n运行 npm run v3 开始构建', 'system');
      } else {
        statusEl.textContent = '等待回复...';
      }
      loadSessions();
      updateInputState();
      stopBtn.classList.remove('visible');
      abortController = null;
    } else {
      addMsg('❌ ' + (data.error || '失败'), 'system');
      statusEl.textContent = '错误';
      input.disabled = false;
      btn.disabled = false;
      stopBtn.classList.remove('visible');
      abortController = null;
    }
  } catch (err) {
    hideLoading();
    addMsg('❌ 连接失败: npm run discuss 是否已启动?', 'system');
    statusEl.textContent = '离线';
    dot.className = 'dot offline';
    input.disabled = false;
    btn.disabled = false;
    stopBtn.classList.remove('visible');
    abortController = null;
  }

  input.focus();
}

// ═══════ 中断 + 编辑 ═══════

function stopSending() {
  if (abortController) {
    abortController.abort();
    abortController = null;
  }
  input.disabled = false;
  btn.disabled = false;
  stopBtn.classList.remove('visible');
  hideLoading();
  statusEl.textContent = '已中断';
  addMsg('⏹ 已停止生成', 'system');
  input.focus();
}

function editLastMessage() {
  if (!lastUserMsg) return;
  const text = lastUserMsg.textContent || '';
  input.value = text;
  input.focus();
  // 移除该消息
  lastUserMsg.remove();
  lastUserMsg = null;
  editLastBtn.classList.remove('visible');
  // TODO: 从后端 session 中也移除
}

// ═══════ 辅助 ═══════

function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function timeAgo(ts) {
  const diff = Date.now() - new Date(ts).getTime();
  if (diff < 60000) return '刚刚';
  if (diff < 3600000) return Math.floor(diff/60000) + '分钟前';
  if (diff < 86400000) return Math.floor(diff/3600000) + '小时前';
  return Math.floor(diff/86400000) + '天前';
}

// IME composition tracking
input.addEventListener('compositionstart', () => { isComposing = true; });
input.addEventListener('compositionend', () => { isComposing = false; });
// Enter = 发送 (IME组合中不触发, Shift+Enter = 换行)
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !isComposing && !e.isComposing) {
    e.preventDefault();
    sendMessage();
  }
});
// ↑ 方向键 = 编辑上一条消息
input.addEventListener('keydown', e => {
  if (e.key === 'ArrowUp' && input.value === '' && lastUserMsg) {
    e.preventDefault();
    editLastMessage();
  }
});

// 启动
loadSessions();
</script>
</body>
</html>
