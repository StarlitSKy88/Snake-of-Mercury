<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phase 0 — 需求讨论</title>
<style>
:root {
  --bg: #111110;
  --surface: #1a1a18;
  --line: #2A2A28;
  --accent: #C0392B;
  --green: #4CAF50;
  --text: #e0e0d8;
  --muted: #888880;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Noto Sans SC', -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
}
/* 侧边栏 */
#sidebar {
  width: 260px;
  background: var(--surface);
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
}
#sidebar-header {
  padding: 16px;
  border-bottom: 1px solid var(--line);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
#sidebar-header h2 { font-size: 14px; font-weight: 400; }
#new-btn {
  background: var(--accent);
  color: #fff;
  border: none;
  padding: 6px 14px;
  border-radius: 14px;
  cursor: pointer;
  font-size: 13px;
}
#session-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
}
.session-item {
  padding: 10px 12px;
  border-radius: 8px;
  cursor: pointer;
  margin-bottom: 4px;
  border: 1px solid transparent;
  transition: all 0.15s;
}
.session-item:hover { background: rgba(255,255,255,0.04); }
.session-item.active { background: rgba(192,57,43,0.12); border-color: var(--accent); }
.session-item .title {
  font-size: 13px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.session-item .meta {
  font-size: 11px;
  color: var(--muted);
  margin-top: 2px;
}
.session-item .badge {
  display: inline-block;
  background: var(--green);
  color: #000;
  padding: 0 6px;
  border-radius: 8px;
  font-size: 10px;
  margin-left: 4px;
}
/* 主区域 */
#main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
}
header {
  padding: 12px 20px;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--surface);
  flex-shrink: 0;
}
header h1 { font-size: 15px; font-weight: 400; }
header .dot { width: 8px; height: 8px; border-radius: 50%; }
header .dot.online { background: var(--green); }
header .dot.offline { background: var(--accent); }
header .status { font-size: 12px; color: var(--muted); margin-left: auto; }
#messages {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.msg {
  max-width: 80%;
  padding: 12px 16px;
  border-radius: 12px;
  line-height: 1.7;
  font-size: 14px;
  white-space: pre-wrap;
  word-break: break-word;
}
.msg.user {
  align-self: flex-end;
  background: var(--accent);
  color: #fff;
  border-bottom-right-radius: 4px;
}
.msg.agent {
  align-self: flex-start;
  background: var(--surface);
  border: 1px solid var(--line);
  border-bottom-left-radius: 4px;
}
.msg.agent .label { font-size: 11px; color: var(--accent); margin-bottom: 6px; font-weight: 500; }
.msg .doc-block {
  background: #0a0a08;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 12px;
  margin-top: 8px;
  font-family: 'SF Mono', 'Fira Code', monospace;
  font-size: 13px;
}
.msg .save-badge {
  display: inline-block;
  background: var(--green);
  color: #000;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 11px;
  margin-top: 8px;
}
.msg.system {
  align-self: center;
  color: var(--muted);
  font-size: 12px;
  text-align: center;
  max-width: 70%;
}
#input-area {
  padding: 14px 20px;
  border-top: 1px solid var(--line);
  display: flex;
  gap: 10px;
  background: var(--surface);
  flex-shrink: 0;
}
#input-area input {
  flex: 1;
  background: var(--bg);
  border: 1px solid var(--line);
  color: var(--text);
  padding: 10px 16px;
  border-radius: 20px;
  font-size: 14px;
  outline: none;
}
#input-area input:focus { border-color: var(--accent); }
#input-area input:disabled { opacity: 0.4; }
#input-area button {
  background: var(--accent);
  color: #fff;
  border: none;
  padding: 10px 20px;
  border-radius: 20px;
  cursor: pointer;
  font-size: 14px;
  white-space: nowrap;
}
#input-area button:disabled { opacity: 0.4; cursor: not-allowed; }
#stop-btn { background: #ff9800; display: none; }
#stop-btn.visible { display: inline-block; }
#edit-last-btn { background: transparent; color: var(--muted); border: 1px solid var(--line); padding: 4px 10px; font-size: 11px; border-radius: 12px; cursor: pointer; display: none; }
#edit-last-btn.visible { display: inline-block; }
.loading { display: inline-flex; gap: 4px; padding: 4px 0; }
.loading span {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--muted);
  animation: bounce 1.4s infinite ease-in-out;
  display: inline-block;
}
.loading span:nth-child(2) { animation-delay: 0.2s; }
.loading span:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounce { 0%,80%,100% { transform: scale(0); } 40% { transform: scale(1); } }

/* ═══ 登录注册浮层 ═══ */
#login-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.8);
  display: flex; align-items: center; justify-content: center;
  z-index: 1000;
}
#login-overlay.hidden { display: none; }
#login-box {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 32px;
  width: 360px;
  max-width: 90vw;
}
#login-box h2 { font-size: 18px; margin-bottom: 20px; font-weight: 400; }
#login-box .field { margin-bottom: 14px; }
#login-box .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
#login-box .field input {
  width: 100%; background: var(--bg); border: 1px solid var(--line);
  color: var(--text); padding: 10px 14px; border-radius: 10px; font-size: 14px;
}
#login-box .field input:focus { border-color: var(--accent); outline: none; }
#login-box .actions { display: flex; gap: 10px; margin-top: 20px; }
#login-box .actions button {
  flex: 1; padding: 10px; border-radius: 10px; border: none;
  font-size: 14px; cursor: pointer;
}
#login-box .btn-primary { background: var(--accent); color: #fff; }
#login-box .btn-secondary { background: transparent; border: 1px solid var(--line); color: var(--text); }
#login-box .error { color: var(--accent); font-size: 12px; margin-top: 8px; }
#login-box .switch { text-align: center; margin-top: 14px; font-size: 12px; color: var(--muted); }
#login-box .switch a { color: var(--accent); cursor: pointer; }

/* user-info in sidebar */
#user-info { padding: 8px 16px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; align-items: center; }
#user-info .logout { color: var(--accent); cursor: pointer; font-size: 11px; }


/* ═══ Tab 导航 ═══ */
#tab-nav { display: flex; gap: 0; border-bottom: 1px solid var(--line); flex-shrink: 0; }
#tab-nav button { 
  flex: 1; padding: 10px 0; background: none; border: none; color: var(--muted);
  font-size: 13px; cursor: pointer; border-bottom: 2px solid transparent;
  transition: all 0.2s;
}
#tab-nav button.active { color: var(--accent); border-bottom-color: var(--accent); }

/* ═══ Dashboard ═══ */
#dashboard { display: none; flex: 1; overflow-y: auto; padding: 20px; flex-direction: column; gap: 12px; }
#dashboard.visible { display: flex; }
#messages.hidden { display: none; }
#input-area.hidden { display: none; }

.dash-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.dash-header h2 { font-size: 16px; font-weight: 400; }
.dash-header button { background: var(--accent); color: #fff; border: none; padding: 8px 16px; border-radius: 14px; cursor: pointer; font-size: 13px; }

.project-card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px;
  cursor: pointer; transition: border-color 0.2s;
}
.project-card:hover { border-color: var(--accent); }
.project-card .p-name { font-size: 15px; margin-bottom: 6px; }
.project-card .p-status {
  display: inline-block; padding: 2px 10px; border-radius: 10px; font-size: 11px;
}
.status-created { background: rgba(255,255,255,0.06); color: var(--muted); }
.status-planning { background: rgba(33,150,243,0.15); color: #2196F3; }
.status-building { background: rgba(255,152,0,0.15); color: #FF9800; }
.status-reviewing { background: rgba(156,39,176,0.15); color: #9C27B0; }
.status-deployed { background: rgba(76,175,80,0.15); color: var(--green); }
.status-paused { background: rgba(244,67,54,0.1); color: var(--accent); }
.project-card .p-meta { font-size: 12px; color: var(--muted); margin-top: 8px; }
.project-card .p-bar {
  height: 3px; background: var(--line); border-radius: 2px; margin-top: 8px; overflow: hidden;
}
.project-card .p-bar-fill {
  height: 100%; background: var(--green); border-radius: 2px; transition: width 0.5s;
}

/* Project Detail */
#project-detail { display: none; flex: 1; overflow-y: auto; padding: 20px; flex-direction: column; gap: 12px; }
#project-detail.visible { display: flex; }
#project-detail .back-btn { background: none; border: 1px solid var(--line); color: var(--muted); padding: 4px 12px; border-radius: 10px; cursor: pointer; font-size: 12px; align-self: flex-start; }
.task-item { padding: 10px; border-radius: 8px; border: 1px solid var(--line); font-size: 13px; display: flex; justify-content: space-between; }
.task-item.done { border-color: var(--green); opacity: 0.8; }
.task-item.failed { border-color: var(--accent); }
.inbox-item { padding: 10px; border: 1px solid #FF9800; border-radius: 8px; font-size: 13px; }
.inbox-item .actions { margin-top: 8px; display: flex; gap: 8px; }
.inbox-item .actions button { padding: 4px 12px; border-radius: 8px; border: none; cursor: pointer; font-size: 12px; }
.btn-approve { background: var(--green); color: #000; }
.btn-reject { background: var(--accent); color: #fff; }

/* New Project Dialog */
#new-project-dialog { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 100; align-items: center; justify-content: center; }
#new-project-dialog.visible { display: flex; }
#new-project-dialog .dialog-box { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 24px; width: 400px; max-width: 90vw; }
#new-project-dialog textarea { width: 100%; background: var(--bg); border: 1px solid var(--line); color: var(--text); padding: 10px; border-radius: 10px; font-size: 14px; resize: vertical; min-height: 80px; }
#new-project-dialog .dialog-actions { display: flex; gap: 10px; margin-top: 14px; justify-content: flex-end; }

</style>
</head>
<body>

<!-- 侧边栏 -->

<!-- 登录浮层 -->
<div id="login-overlay">
  <div id="login-box">
    <h2 id="login-title">🐍 登录</h2>
    <div class="field">
      <label>用户名</label>
      <input id="login-username" type="text" placeholder="输入用户名" autocomplete="username">
    </div>
    <div class="field" id="register-fields" style="display:none">
      <label>确认密码</label>
      <input id="login-confirm" type="password" placeholder="再次输入密码" autocomplete="new-password">
    </div>
    <div class="field">
      <label>密码</label>
      <input id="login-password" type="password" placeholder="输入密码" autocomplete="current-password">
    </div>
    <div class="error" id="login-error"></div>
    <div class="actions">
      <button class="btn-primary" id="login-submit" onclick="handleAuth()">登录</button>
    </div>
    <div class="switch">
      <span id="switch-text">没有账号？</span> <a id="switch-link" onclick="toggleAuthMode()">注册</a>
    </div>
  </div>
</div>

<div id="sidebar">
  <div id="sidebar-header">
    <h2>💬 历史对话</h2>
    <button id="new-btn" onclick="newSession()">+ 新对话</button>
  </div>
  <div id="session-list"></div>
  <div id="user-info">
    <span id="user-name-display"></span>
    <span class="logout" onclick="logout()">退出</span>
  </div>
</div>

<!-- 主区域 -->
<div id="main">
  <header>
    <div class="dot online" id="dot"></div>
    <h1>Phase 0 · 需求讨论</h1>
    <span class="status" id="status">就绪</span>
  
</header>
<div id="tab-nav">
  <button id="tab-chat" class="active" onclick="switchTab('chat')">💬 对话</button>
  <button id="tab-dashboard" onclick="switchTab('dashboard')">📊 项目</button>
</div>
<div id="dashboard">
  <div class="dash-header">
    <h2>我的项目</h2>
    <button onclick="showNewProject()">+ 新建项目</button>
  </div>
  <div id="project-cards"></div>
</div>
<div id="project-detail">
  <button class="back-btn" onclick="switchTab('dashboard')">← 返回</button>
  <h2 id="detail-name" style="font-weight:400;margin-top:8px;"></h2>
  <div id="detail-tasks"></div>
  <div id="detail-inbox"></div>
  <div style="margin-top:12px;">
    <h3 style="font-size:13px;color:var(--muted);margin-bottom:8px;">💬 反馈优化</h3>
    <textarea id="feedback-input" placeholder="输入反馈，如：加载太慢、需要暗色模式..." style="width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);padding:8px;border-radius:8px;font-size:13px;resize:vertical;min-height:50px;"></textarea>
    <button onclick="submitFeedback()" style="margin-top:8px;background:var(--accent);color:#fff;border:none;padding:6px 16px;border-radius:12px;cursor:pointer;font-size:13px;">提交反馈</button>
  </div>
</div>
<div id="new-project-dialog">
  <div class="dialog-box">
    <h2 style="font-size:16px;font-weight:400;margin-bottom:12px;">新建项目</h2>
    <textarea id="new-project-req" placeholder="描述你的需求，如：帮我做一个待办事项应用..."></textarea>
    <div class="dialog-actions">
      <button onclick="hideNewProject()" style="background:none;border:1px solid var(--line);color:var(--muted);padding:6px 16px;border-radius:10px;cursor:pointer;">取消</button>
      <button onclick="createProject()" style="background:var(--accent);color:#fff;border:none;padding:6px 16px;border-radius:10px;cursor:pointer;">创建并启动</button>
    </div>
  </div>
</div>


  <div id="messages">
    <div class="msg system">👋 告诉我你的创业想法，我会通过提问帮你梳理清楚。</div>
  </div>

  <div id="input-area">
    <input id="user-input" placeholder="输入你的想法..." autofocus>
    <button id="edit-last-btn" onclick="editLastMessage()" title="编辑上一条消息 (↑)">✎</button>
    <button id="send-btn" onclick="sendMessage()">发送</button>
    <button id="stop-btn" onclick="stopSending()" title="中断当前回复">⏹ 停止</button>
  </div>
</div>

<script>
let currentSessionId = 'sess-' + Date.now();
let currentSaved = false;
let isComposing = false;  // IME 组合输入状态
let abortController = null;  // 用于中断请求
let lastUserMsg = null;  // 上一条用户消息 DOM 元素

const messages = document.getElementById('messages');
const input = document.getElementById('user-input');
const btn = document.getElementById('send-btn');
const statusEl = document.getElementById('status');
const dot = document.getElementById('dot');
const sessionList = document.getElementById('session-list');
const stopBtn = document.getElementById('stop-btn');
const editLastBtn = document.getElementById('edit-last-btn');

// ═══════ 会话管理 ═══════

async function loadSessions() {
  try {
    const res = await fetch('/api/sessions');
    const sessions = await res.json();
    renderSessionList(sessions);
  } catch(e) {}
}

function renderSessionList(sessions) {
  sessionList.innerHTML = sessions.map(s => `
    <div class="session-item ${s.id === currentSessionId ? 'active' : ''}" 
         onclick="switchSession('${s.id}')">
      <div class="title">${escHtml(s.title || '新对话')} ${s.saved ? '<span class="badge">已保存</span>' : ''}</div>
      <div class="meta">${s.turnCount} 轮 · ${timeAgo(s.updatedAt)}</div>
    </div>
  `).join('') || '<div style="color:var(--muted);padding:12px;font-size:12px;">暂无历史对话</div>';
}

async function switchSession(id) {
  if (id === currentSessionId) return;
  try {
    const res = await fetch('/api/sessions/load', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sessionId: id })
    });
    const data = await res.json();
    if (data.success) {
      currentSessionId = id;
      currentSaved = !!data.session.savedPath;
      renderTurns(data.session.turns);
      loadSessions();
      updateInputState();
      stopBtn.classList.remove('visible');
      abortController = null;
    }
  } catch(e) {}
}

function newSession() {
  currentSessionId = 'sess-' + Date.now();
  currentSaved = false;
  messages.innerHTML = '<div class="msg system">👋 新对话。告诉我你的创业想法。</div>';
  loadSessions();
  updateInputState();
  input.focus();
}

// ═══════ 消息渲染 ═══════

function renderTurns(turns) {
  messages.innerHTML = '';
  if (turns.length === 0) {
    messages.innerHTML = '<div class="msg system">👋 告诉我你的创业想法。</div>';
    return;
  }
  for (const t of turns) {
    addMsg(t.content, t.role);
  }
  messages.scrollTop = messages.scrollHeight;
}

function addMsg(text, role) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  
  if (role === 'agent') {
    let html = '<div class="label">🧠 需求讨论 Agent</div>';
    const docMatch = text.match(/```REQUIREMENT\n([\s\S]*?)```/);
    if (docMatch) {
      const parts = text.split(/```REQUIREMENT[\s\S]*?```/);
      html += parts[0].replace(/\n/g, '<br>');
      html += '<div class="doc-block">' + docMatch[1].replace(/\n/g, '<br>') + '</div>';
      if (parts[1]) html += parts[1].replace(/\n/g, '<br>');
    } else {
      html += text.replace(/\n/g, '<br>');
    }
    if (text.includes('READY_TO_SAVE')) {
      html += '<div class="save-badge">✅ 已保存 REQUIREMENT.md</div>';
    }
    div.innerHTML = html;
  } else if (role === 'user') {
    div.textContent = text;
  } else {
    div.textContent = text;
  }
  
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
  return div;
}

function updateInputState() {
  if (currentSaved) {
    input.disabled = true;
    btn.disabled = true;
    btn.textContent = '✅ 已完成';
    btn.style.background = 'var(--green)';
    statusEl.textContent = '需求已保存';
  } else {
    input.disabled = false;
    btn.disabled = false;
    btn.textContent = '发送';
    btn.style.background = 'var(--accent)';
    statusEl.textContent = '就绪';
  }
}

// ═══════ 发送消息 ═══════

let loadingDiv = null;
function showLoading() {
  loadingDiv = document.createElement('div');
  loadingDiv.className = 'msg agent';
  loadingDiv.innerHTML = '<div class="label">🧠 需求讨论 Agent</div><div class="loading"><span></span><span></span><span></span></div>';
  messages.appendChild(loadingDiv);
}
function hideLoading() { if (loadingDiv) { loadingDiv.remove(); loadingDiv = null; } }

async function sendMessage() {
  const text = input.value.trim();
  if (!text || currentSaved) return;

  const userMsg = addMsg(text, 'user');
  lastUserMsg = userMsg;
  editLastBtn.classList.add('visible');
  input.value = '';
  input.disabled = true;
  btn.disabled = true;
  stopBtn.classList.add('visible');
  statusEl.textContent = '思考中...';
  showLoading();

  // AbortController for interrupt
  abortController = new AbortController();

  try {
    const res = await fetch('/api/discuss', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, sessionId: currentSessionId }),
      signal: abortController.signal
    });
    const data = await res.json();
    hideLoading();

    if (data.success) {
      addMsg(data.reply, 'agent');
      if (data.readyToSave) {
        currentSaved = true;
        statusEl.textContent = '需求已保存';
        addMsg('📄 已保存到 .tasks/REQUIREMENT.md\n运行 npm run v3 开始构建', 'system');
      } else {
        statusEl.textContent = '等待回复...';
      }
      loadSessions();
      updateInputState();
      stopBtn.classList.remove('visible');
      abortController = null;
    } else {
      addMsg('❌ ' + (data.error || '失败'), 'system');
      statusEl.textContent = '错误';
      input.disabled = false;
      btn.disabled = false;
      stopBtn.classList.remove('visible');
      abortController = null;
    }
  } catch (err) {
    hideLoading();
    addMsg('❌ 连接失败: npm run discuss 是否已启动?', 'system');
    statusEl.textContent = '离线';
    dot.className = 'dot offline';
    input.disabled = false;
    btn.disabled = false;
    stopBtn.classList.remove('visible');
    abortController = null;
  }

  input.focus();
}

// ═══════ 中断 + 编辑 ═══════

function stopSending() {
  if (abortController) {
    abortController.abort();
    abortController = null;
  }
  input.disabled = false;
  btn.disabled = false;
  stopBtn.classList.remove('visible');
  hideLoading();
  statusEl.textContent = '已中断';
  addMsg('⏹ 已停止生成', 'system');
  input.focus();
}

function editLastMessage() {
  if (!lastUserMsg) return;
  const text = lastUserMsg.textContent || '';
  input.value = text;
  input.focus();
  // 移除该消息
  lastUserMsg.remove();
  lastUserMsg = null;
  editLastBtn.classList.remove('visible');
  // TODO: 从后端 session 中也移除
}

// ═══════ 辅助 ═══════

function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function timeAgo(ts) {
  const diff = Date.now() - new Date(ts).getTime();
  if (diff < 60000) return '刚刚';
  if (diff < 3600000) return Math.floor(diff/60000) + '分钟前';
  if (diff < 86400000) return Math.floor(diff/3600000) + '小时前';
  return Math.floor(diff/86400000) + '天前';
}

// IME composition tracking
input.addEventListener('compositionstart', () => { isComposing = true; });
input.addEventListener('compositionend', () => { isComposing = false; });
// Enter = 发送 (IME组合中不触发, Shift+Enter = 换行)
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !isComposing && !e.isComposing) {
    e.preventDefault();
    sendMessage();
  }
});
// ↑ 方向键 = 编辑上一条消息
input.addEventListener('keydown', e => {
  if (e.key === 'ArrowUp' && input.value === '' && lastUserMsg) {
    e.preventDefault();
    editLastMessage();
  }
});


// ═══════ 登录/注册 ═══════
let authMode = 'login'; // 'login' | 'register'
const AUTH_KEY = 'som_user';

function getUser() {
  try { return JSON.parse(localStorage.getItem(AUTH_KEY)); } catch { return null; }
}
function setUser(u) { localStorage.setItem(AUTH_KEY, JSON.stringify(u)); }

function toggleAuthMode() {
  authMode = authMode === 'login' ? 'register' : 'login';
  document.getElementById('login-title').textContent = authMode === 'login' ? '🐍 登录' : '🐍 注册';
  document.getElementById('login-submit').textContent = authMode === 'login' ? '登录' : '注册';
  document.getElementById('switch-text').textContent = authMode === 'login' ? '没有账号？' : '已有账号？';
  document.getElementById('switch-link').textContent = authMode === 'login' ? '注册' : '登录';
  document.getElementById('register-fields').style.display = authMode === 'register' ? 'block' : 'none';
  document.getElementById('login-error').textContent = '';
}

function handleAuth() {
  const username = document.getElementById('login-username').value.trim();
  const password = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-error');
  errEl.textContent = '';

  if (!username || !password) { errEl.textContent = '请填写所有字段'; return; }
  if (username.length < 2) { errEl.textContent = '用户名至少2个字符'; return; }
  if (password.length < 4) { errEl.textContent = '密码至少4个字符'; return; }

  if (authMode === 'register') {
    const confirm = document.getElementById('login-confirm').value;
    if (password !== confirm) { errEl.textContent = '两次密码不一致'; return; }
    // Check existing
    const existing = JSON.parse(localStorage.getItem('som_users') || '{}');
    if (existing[username]) { errEl.textContent = '用户名已存在'; return; }
    existing[username] = { password, createdAt: new Date().toISOString() };
    localStorage.setItem('som_users', JSON.stringify(existing));
  } else {
    const existing = JSON.parse(localStorage.getItem('som_users') || '{}');
    if (!existing[username]) { errEl.textContent = '用户不存在'; return; }
    if (existing[username].password !== password) { errEl.textContent = '密码错误'; return; }
  }

  setUser({ username, loginAt: new Date().toISOString() });
  document.getElementById('login-overlay').classList.add('hidden');
  document.getElementById('user-name-display').textContent = '👤 ' + username;
}

function logout() {
  localStorage.removeItem(AUTH_KEY);
  document.getElementById('login-overlay').classList.remove('hidden');
  document.getElementById('user-name-display').textContent = '';
  document.getElementById('login-username').value = '';
  document.getElementById('login-password').value = '';
  document.getElementById('login-error').textContent = '';
}

// Check auth on load
(function() {
  const user = getUser();
  if (user) {
    document.getElementById('login-overlay').classList.add('hidden');
    document.getElementById('user-name-display').textContent = '👤 ' + user.username;
  }
  // Init demo account if no users exist
  const users = JSON.parse(localStorage.getItem('som_users') || '{}');
  if (Object.keys(users).length === 0) {
    localStorage.setItem('som_users', JSON.stringify({ 'demo': { password: 'demo123', createdAt: new Date().toISOString() } }));
  }
})();



// ═══════ Dashboard ═══════
let currentTab = 'chat';
let currentDetailProjectId = null;

function switchTab(tab) {
  currentTab = tab;
  document.getElementById('tab-chat').classList.toggle('active', tab === 'chat');
  document.getElementById('tab-dashboard').classList.toggle('active', tab === 'dashboard');
  document.getElementById('messages').classList.toggle('hidden', tab !== 'chat');
  document.getElementById('input-area').classList.toggle('hidden', tab !== 'chat');
  document.getElementById('dashboard').classList.toggle('visible', tab === 'dashboard');
  document.getElementById('project-detail').classList.toggle('visible', false);
  if (tab === 'dashboard') refreshDashboard();
}

function showNewProject() { document.getElementById('new-project-dialog').classList.add('visible'); }
function hideNewProject() { document.getElementById('new-project-dialog').classList.remove('visible'); }

async function createProject() {
  const req = document.getElementById('new-project-req').value.trim();
  if (!req) return;
  hideNewProject();
  try {
    const res = await fetch('/api/projects/create', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ requirement: req })
    });
    const data = await res.json();
    if (data.success) {
      document.getElementById('new-project-req').value = '';
      switchTab('dashboard');
      refreshDashboard();
    }
  } catch(e) { console.error(e); }
}

async function refreshDashboard() {
  try {
    const res = await fetch('/api/projects/list');
    const data = await res.json();
    const container = document.getElementById('project-cards');
    if (!data.projects || data.projects.length === 0) {
      container.innerHTML = '<div style="color:var(--muted);text-align:center;padding:40px;">还没有项目，点击上方按钮创建</div>';
      return;
    }
    container.innerHTML = data.projects.map(p => {
      const summary = p.tasks || '';
      const done = (summary.match(/done/gi) || []).length;
      const total = done + (summary.match(/progress|pending/gi) || []).length || 1;
      const pct = Math.round(done / Math.max(total, 1) * 100);
      return `<div class="project-card" onclick="openProject('${p.id}','${p.name}')">
        <div class="p-name">${escHtml(p.name)}</div>
        <span class="p-status status-${p.status}">${p.status}</span>
        <div class="p-meta">${summary} | ${p.createdAt ? timeAgo(p.createdAt) : ''}</div>
        <div class="p-bar"><div class="p-bar-fill" style="width:${pct}%"></div></div>
      </div>`;
    }).join('');
  } catch(e) { console.error(e); }
}

async function openProject(id, name) {
  currentDetailProjectId = id;
  document.getElementById('dashboard').classList.remove('visible');
  document.getElementById('project-detail').classList.add('visible');
  document.getElementById('detail-name').textContent = name;
  await refreshProjectDetail(id);
  connectSSE(id);
}

let currentSSE = null;
function connectSSE(projectId) {
  if (currentSSE) currentSSE.close();
  currentSSE = new EventSource('/api/projects/' + projectId + '/stream');
  currentSSE.onmessage = (e) => {
    try {
      const data = JSON.parse(e.data);
      if (data.type === 'connected') return;
      refreshProjectDetail(projectId);
    } catch {}
  };
  currentSSE.onerror = () => { currentSSE?.close(); };
}

async function refreshProjectDetail(projectId) {
  try {
    const res = await fetch('/api/projects/' + projectId + '/status');
    const data = await res.json();
    document.getElementById('detail-tasks').innerHTML = `
      <div style="display:flex;gap:12px;margin-bottom:12px;">
        <span style="color:var(--green);">✅ ${data.completed || 0}</span>
        <span style="color:#FF9800;">🔄 ${data.inProgress || 0}</span>
        <span style="color:var(--muted);">⏳ ${data.pending || 0}</span>
        <span style="color:var(--accent);">❌ ${data.failed || 0}</span>
      </div>
      <div style="font-size:13px;color:var(--muted);">状态: ${data.status}</div>
    `;
    
    // Inbox
    if (data.inbox > 0) {
      document.getElementById('detail-inbox').innerHTML = '<div style="margin-top:12px;color:#FF9800;">📬 ' + data.inbox + ' 项待审批 (需在控制台 approve)</div>';
    }
  } catch(e) {}
}

async function submitFeedback() {
  const fb = document.getElementById('feedback-input').value.trim();
  if (!fb || !currentDetailProjectId) return;
  try {
    await fetch('/api/projects/' + currentDetailProjectId + '/feedback', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ feedback: fb })
    });
    document.getElementById('feedback-input').value = '';
    refreshProjectDetail(currentDetailProjectId);
  } catch(e) {}
}

// Auto refresh dashboard every 10s
setInterval(() => { if (currentTab === 'dashboard') refreshDashboard(); }, 10000);

// 启动
loadSessions();
</script>
